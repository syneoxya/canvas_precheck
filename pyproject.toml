[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas-precheck"
version = "0.1.0"
dependencies = [
  "requests",
  "pydantic",
  "python-dateutil",
  "openpyxl",
  "pypdf",
  "PyMuPDF",
  "Pillow",
  "pytesseract",
  "python-docx",
  "fastapi",
  "uvicorn",
  "langchain",
  "langchain-openai"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
